name: Build ExtendedHorizons
on:
  push:
    branches: [ "v3", "dev" ]
  pull_request:
    branches: [ "v3", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ExtendedHorizons
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Checkout MapacheeeLib
        uses: actions/checkout@v4
        with:
          repository: Mapacheee/MapacheeeLib
          path: deps/mapacheeelib
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Publish MapacheeeLib to MavenLocal (Estructura inicial)
        run: |
          cd deps/mapacheeelib
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon

      - name: Build MapacheeeLib ShadowJar (JAR Pesado)
        run: |
          cd deps/mapacheeelib
          ./gradlew shadowJar --no-daemon

      - name: Inject ShadowJar into MavenLocal Cache
        run: |
          # Detecta el JAR pesado completo que acabamos de compilar
          FAT_JAR=$(ls -S deps/mapacheeelib/build/libs/*.jar | head -n 1)
          echo "Fat JAR detectado en: $FAT_JAR"
          
          # Busca el JAR ligero en el repositorio local de Maven y lo reemplaza por el pesado
          find /home/runner/.m2/repository -iname "*mapacheeelib*.jar" -exec cp -v "$FAT_JAR" {} \;

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew shadowJar --no-daemon

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtendedHorizons-Jar
          path: build/libs/ExtendedHorizons-*.jar
          retention-days: 7
          if-no-files-found: error

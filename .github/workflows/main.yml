name: Build ExtendedHorizons
on:
  push:
    branches: [ "v3", "dev" ]
  pull_request:
    branches: [ "v3", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ExtendedHorizons
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Checkout MapacheeeLib
        uses: actions/checkout@v4
        with:
          repository: Mapacheee/MapacheeeLib
          path: deps/mapacheeelib
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Build MapacheeeLib ShadowJar (JAR Pesado)
        run: |
          cd deps/mapacheeelib
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon

      - name: Inject Fat JAR into local libs folder
        run: |
          mkdir -p libs
          FAT_JAR=$(ls -S deps/mapacheeelib/build/libs/*.jar | head -n 1)
          cp "$FAT_JAR" libs/MapacheeeLib-local.jar
          echo "JAR pesado copiado a libs/MapacheeeLib-local.jar"

      - name: Auto-detect and Patch Build Script (DSL Agnostic)
        run: |
          PATCH_LINE="dependencies { compileOnly(files(\"libs/MapacheeeLib-local.jar\")); implementation(files(\"libs/MapacheeeLib-local.jar\")) }"
          if [ -f "build.gradle.kts" ]; then
            echo "Detectado build.gradle.kts (Kotlin). Parchando..."
            echo "" >> build.gradle.kts
            echo "$PATCH_LINE" >> build.gradle.kts
          else
            echo "Detectado build.gradle (Groovy). Parchando..."
            echo "" >> build.gradle
            echo "$PATCH_LINE" >> build.gradle
          fi

      - name: Overwrite all Gradle and Maven Caches
        run: |
          FAT_JAR=$(ls -S deps/mapacheeelib/build/libs/*.jar | head -n 1)
          echo "Remplazando cualquier copia ligera remanente en los cachés del sistema..."
          find ~/.m2/repository -name "*mapacheeelib*.jar" -exec cp -v "$FAT_JAR" {} \; 2>/dev/null || true
          find ~/.gradle/caches -name "*mapacheeelib*.jar" -exec cp -v "$FAT_JAR" {} \; 2>/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Plugin
        run: ./gradlew shadowJar --no-daemon

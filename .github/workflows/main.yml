name: Build ExtendedHorizons
on:
  push:
    branches: [ "v3", "dev" ]
  pull_request:
    branches: [ "v3", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ExtendedHorizons
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Checkout MapacheeeLib
        uses: actions/checkout@v4
        with:
          repository: Mapacheee/MapacheeeLib
          path: deps/mapacheeelib
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Build MapacheeeLib ShadowJar
        run: |
          cd deps/mapacheeelib
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon

      - name: Inject Fat JAR into ExtendedHorizons libs
        run: |
          mkdir -p libs
          FAT_JAR=$(ls -S deps/mapacheeelib/build/libs/*.jar | head -n 1)
          cp "$FAT_JAR" libs/MapacheeeLib-1.0.1.jar

      - name: Force local jar dependency in build.gradle
        run: |
          echo "" >> build.gradle
          echo "dependencies { compileOnly files('libs/MapacheeeLib-1.0.1.jar'); implementation files('libs/MapacheeeLib-1.0.1.jar') }" >> build.gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew shadowJar --no-daemon

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtendedHorizons-Jar
          path: build/libs/ExtendedHorizons-*.jar
          retention-days: 7
          if-no-files-found: error
